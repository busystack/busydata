# Canonical source inclusion and intentional executable semantics. UTF-8 paths.
# Local IDE library/module indexes, caches and .iml files are not source artifacts.
policy=busydata-source-v1
inputs=lib,backend/src,backend/native,backend/pom.xml,backend/mvnw,backend/mvnw.cmd,backend/.mvn,protocol,linux,windows,test,integration_test,tool,config,third_party,pubspec.yaml,pubspec.lock,analysis_options.yaml,l10n.yaml,.github,snap,docs,README.md,LICENSE,.gitignore,.idea/.gitignore,.idea/markdown.xml,.idea/misc.xml,.idea/modules.xml,.idea/vcs.xml
generatedParts=__pycache__,ephemeral,.dart_tool,build,target,cache
generatedPaths=docs/acceptance
executableExact=backend/mvnw
executableRoot=tool
executableExtensions=.sh
nonExecutablePrefixes=test_
maxFiles=16384
maxFileBytes=33554432
maxSourceBytes=268435456
