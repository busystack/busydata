name: busydata
description: Independent PostgreSQL, MySQL and MariaDB desktop workbench.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  fluent_ui: 4.16.1
  fluentui_system_icons: 1.1.273
  yaru: 10.2.0
  ubuntu_localizations: 0.5.2+3
  system_theme: 3.3.0
  go_router: 17.3.0
  grpc: 5.1.0
  http2: 3.1.0
  protobuf: 6.0.0
  fixnum: 1.1.1
  re_editor: 0.9.0
  re_highlight: 0.0.3
  two_dimensional_scrollables: 0.3.7
  path_provider: 2.1.5
  path: 1.9.1
  file_selector: 1.1.0
  flutter_secure_storage: 10.3.0
  cryptography: 2.9.0
  crypto: 3.0.7
  dbus: 0.7.14
  posix: 6.5.0
  uuid: 4.5.3

  intl: 0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.4
  image: 4.8.0
  protoc_plugin: 25.0.0
  xml: 6.6.1

  file_selector_platform_interface: 2.7.0
dependency_overrides:
  # Official 3.1.0 fixes canceled-stream headers. BusyData's public transport
  # adapter separately enforces private response-stream ownership. grpc stays pinned.
  http2: 3.1.0
  yaru_window: 0.2.2

flutter:
  generate: true
  uses-material-design: true
